    <span>Tree</span>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const widget = document.getElementById("growth-progress");
  const fill = document.getElementById("growth-progress-fill");
  if (!widget || !fill || typeof Reveal === "undefined") return;

  function updateGrowthProgress() {
    const progress = typeof Reveal.getProgress === "function" ? Reveal.getProgress() : 0;
    const stage = Math.max(0, Math.min(5, Math.floor(progress * 6)));
    const left = 8 + progress * 118;
    widget.dataset.stage = String(stage);
    fill.style.width = `${Math.max(0, Math.min(100, progress * 100))}%`;
    widget.querySelectorAll(".growth-progress-stage").forEach((node) => {
      node.style.left = `${left}px`;
    });
  }

  if (Reveal.isReady && Reveal.isReady()) {
    updateGrowthProgress();
  }

  Reveal.on("ready", updateGrowthProgress);
  Reveal.on("slidechanged", updateGrowthProgress);
  Reveal.on("resize", updateGrowthProgress);
});
</script>
